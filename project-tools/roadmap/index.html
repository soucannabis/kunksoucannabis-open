<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kunk — Roadmap de funcionalidades</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow">Protótipo</p>
          <h1>Roadmap de funcionalidades</h1>
          <p class="subtitle">
            Árvore Admin → Kunk → Cadastro → Doc-sign · play e2e · API com relatório · manual abre a página
          </p>
        </div>
        <div class="top-actions">
          <button type="button" class="btn" id="btn-expand">Expandir tudo</button>
          <button type="button" class="btn" id="btn-collapse">Recolher</button>
          <button type="button" class="btn" id="btn-export">Exportar checks</button>
          <label class="btn btn-file">
            Importar
            <input type="file" id="input-import" accept="application/json,.json" hidden />
          </label>
          <button type="button" class="btn btn-ghost" id="btn-reset">Limpar checks</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="filters">
        <label class="chip">
          <input type="checkbox" id="filter-pending" />
          Só pendentes
        </label>
        <label class="chip">
          App
          <select id="filter-app">
            <option value="">Todos</option>
            <option value="admin">Admin</option>
            <option value="kunk">Kunk</option>
            <option value="registration">Sistema de cadastro</option>
            <option value="doc-sign">Doc-sign</option>
          </select>
        </label>
      </div>

      <div class="layout">
        <main class="tree-panel">
          <div id="tree" class="tree" role="tree"></div>
        </main>
        <aside class="detail-panel" id="detail">
          <p class="muted">Selecione um nó na árvore para ver detalhes e marcar testes.</p>
        </aside>
      </div>
    </div>

    <div id="report-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
        <div class="modal-head">
          <h2 id="report-modal-title">Relatório API / unit</h2>
          <button type="button" class="btn" id="report-modal-close">Fechar</button>
        </div>
        <div id="report-modal-body" class="modal-body"></div>
      </div>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
