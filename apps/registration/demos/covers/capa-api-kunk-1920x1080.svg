      <polygon points="0,-78 68,-40 68,40 0,78 -68,40 -68,-40"/>
      <polygon points="0,-42 38,-22 38,22 0,42 -38,22 -38,-22"/>
      <path d="M0 -78 L0 -42 M68 -40 L38 -22 M68 40 L38 22 M0 78 L0 42 M-68 40 L-38 22 M-68 -40 L-38 -22"/>
      <path d="M-68 -40 L0 0 L68 -40 M-68 40 L0 0 L68 40"/>
    </g>
    <text y="8" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#fff">API</text>
    <!-- cadeado -->
    <g transform="translate(0,42)" fill="none" stroke="#fff" stroke-width="2.6">
      <rect x="-10" y="0" width="20" height="16" rx="2" fill="#fff" stroke="none"/>
      <path d="M-6 0 V-8 A6 6 0 0 1 6 -8 V0" stroke="#fff"/>
      <circle cx="0" cy="8" r="2" fill="#003528" stroke="none"/>
    </g>
  </g>

  <!-- Painel direito -->
  <g>
    <rect x="1290" y="290" width="420" height="520" rx="28" fill="#fdf4e5" stroke="#c9a24a" stroke-width="3"/>
    <text x="1500" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111">PARA A ASSOCIAÇÃO</text>
    <line x1="1330" y1="365" x2="1670" y2="365" stroke="#111" stroke-width="2"/>

    <!-- item 1 -->
    <circle cx="1370" cy="430" r="28" fill="#111"/>
    <text x="1370" y="437" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="16" fill="#fff">API</text>
    <text x="1420" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="1420" dy="0">API própria da</tspan>
      <tspan x="1420" dy="26">associação</tspan>
    </text>

    <!-- item 2 -->
    <circle cx="1370" cy="530" r="28" fill="#111"/>
    <g fill="none" stroke="#fff" stroke-width="2.3" transform="translate(1370,530)">
      <path d="M-10 -8 H2 V2 H-10 Z"/>
      <path d="M2 -2 H12 V10 H2 Z"/>
      <path d="M-4 2 V12 H8"/>
    </g>
    <text x="1420" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="1420" dy="0">Integrações sob</tspan>
      <tspan x="1420" dy="26">controle</tspan>
    </text>

    <!-- item 3 -->
    <circle cx="1370" cy="630" r="28" fill="#111"/>
    <g fill="none" stroke="#fff" stroke-width="2.2" transform="translate(1370,630)">
      <ellipse cx="0" cy="-8" rx="12" ry="5"/>
      <path d="M-12 -8 V0 C-12 4 12 4 12 0 V-8"/>
      <path d="M-12 0 V8 C-12 12 12 12 12 8 V0"/>
    </g>
    <text x="1420" y="622" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="1420" dy="0">Dados únicos em</tspan>
      <tspan x="1420" dy="26">todos os portais</tspan>
    </text>
  </g>

  <!-- Rodapé -->
  <g>
    <rect x="560" y="980" width="800" height="54" rx="12" fill="#fdf4e5"/>
    <text x="960" y="1015" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111">Auth ’ Recursos ’ Integração ’ Operação</text>
  </g>
