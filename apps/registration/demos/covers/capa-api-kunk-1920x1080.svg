<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="API KUNK">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#021428"/>
      <stop offset="45%" stop-color="#03314f"/>
      <stop offset="100%" stop-color="#012018"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1ec8ff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0a6a8a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00140a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Rede neural decorativa -->
  <g fill="none" stroke="#5fe0ff" stroke-width="1.2" opacity="0.55" filter="url(#softGlow)">
    <path d="M120 180 L280 240 L420 160 L560 260 L700 190 L820 300 L960 220 L1100 310 L1240 200 L1380 290 L1520 180 L1680 250 L1800 160"/>
    <path d="M80 420 L220 480 L360 400 L500 520 L640 430 L780 540 L920 450 L1060 560 L1200 460 L1340 550 L1480 440 L1620 530 L1840 470"/>
    <path d="M140 720 L300 780 L440 690 L580 820 L720 730 L860 840 L1000 750 L1140 860 L1280 740 L1420 850 L1560 760 L1720 830"/>
    <path d="M200 120 L260 320 L340 520 L400 700 L480 900"/>
    <path d="M1720 140 L1660 340 L1580 540 L1520 720 L1440 920"/>
    <path d="M960 80 L900 280 L820 460 L760 650 L700 860"/>
    <path d="M960 80 L1020 280 L1100 460 L1160 650 L1220 860"/>
  </g>
  <g fill="#8ff0ff" opacity="0.85" filter="url(#softGlow)">
    <circle cx="120" cy="180" r="3.5"/><circle cx="280" cy="240" r="2.8"/><circle cx="420" cy="160" r="3.2"/>
    <circle cx="560" cy="260" r="2.6"/><circle cx="700" cy="190" r="3"/><circle cx="820" cy="300" r="2.5"/>
    <circle cx="960" cy="220" r="3.4"/><circle cx="1100" cy="310" r="2.7"/><circle cx="1240" cy="200" r="3"/>
    <circle cx="1380" cy="290" r="2.6"/><circle cx="1520" cy="180" r="3.1"/><circle cx="1680" cy="250" r="2.8"/>
    <circle cx="220" cy="480" r="3"/><circle cx="500" cy="520" r="2.7"/><circle cx="780" cy="540" r="3.2"/>
    <circle cx="1060" cy="560" r="2.8"/><circle cx="1340" cy="550" r="3"/><circle cx="1620" cy="530" r="2.6"/>
    <circle cx="300" cy="780" r="2.9"/><circle cx="580" cy="820" r="3.1"/><circle cx="860" cy="840" r="2.7"/>
    <circle cx="1140" cy="860" r="3"/><circle cx="1420" cy="850" r="2.8"/><circle cx="1720" cy="830" r="3.2"/>
  </g>

  <!-- Folhas cannabis (esquerda) -->
  <g filter="url(#leafShadow)" opacity="0.92">
    <g transform="translate(40,320) rotate(-18)">
      <ellipse cx="0" cy="0" rx="42" ry="110" fill="#2f7a3a"/>
      <ellipse cx="-38" cy="-20" rx="28" ry="78" fill="#3b9146" transform="rotate(-35)"/>
      <ellipse cx="38" cy="-20" rx="28" ry="78" fill="#3b9146" transform="rotate(35)"/>
      <ellipse cx="-55" cy="25" rx="22" ry="60" fill="#256b32" transform="rotate(-55)"/>
      <ellipse cx="55" cy="25" rx="22" ry="60" fill="#256b32" transform="rotate(55)"/>
      <ellipse cx="-28" cy="55" rx="18" ry="48" fill="#1e5a2a" transform="rotate(-20)"/>
