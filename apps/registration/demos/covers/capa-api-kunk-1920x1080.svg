      <path d="M0 -100 L0 70" stroke="#174820" stroke-width="3"/>
    </g>
    <g transform="translate(95,620) rotate(12) scale(0.85)">
      <ellipse cx="0" cy="0" rx="36" ry="95" fill="#348640"/>
      <ellipse cx="-32" cy="-16" rx="24" ry="68" fill="#2f7a3a" transform="rotate(-35)"/>
      <ellipse cx="32" cy="-16" rx="24" ry="68" fill="#2f7a3a" transform="rotate(35)"/>
      <ellipse cx="-48" cy="22" rx="18" ry="52" fill="#256b32" transform="rotate(-55)"/>
      <ellipse cx="48" cy="22" rx="18" ry="52" fill="#256b32" transform="rotate(55)"/>
      <path d="M0 -88 L0 60" stroke="#174820" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Folhas cannabis (direita) -->
  <g filter="url(#leafShadow)" opacity="0.92">
    <g transform="translate(1840,300) rotate(22)">
      <ellipse cx="0" cy="0" rx="42" ry="110" fill="#2f7a3a"/>
      <ellipse cx="-38" cy="-20" rx="28" ry="78" fill="#3b9146" transform="rotate(-35)"/>
      <ellipse cx="38" cy="-20" rx="28" ry="78" fill="#3b9146" transform="rotate(35)"/>
      <ellipse cx="-55" cy="25" rx="22" ry="60" fill="#256b32" transform="rotate(-55)"/>
      <ellipse cx="55" cy="25" rx="22" ry="60" fill="#256b32" transform="rotate(55)"/>
      <path d="M0 -100 L0 70" stroke="#174820" stroke-width="3"/>
    </g>
    <g transform="translate(1765,650) rotate(-14) scale(0.9)">
      <ellipse cx="0" cy="0" rx="38" ry="100" fill="#348640"/>
      <ellipse cx="-34" cy="-18" rx="25" ry="70" fill="#2f7a3a" transform="rotate(-35)"/>
      <ellipse cx="34" cy="-18" rx="25" ry="70" fill="#2f7a3a" transform="rotate(35)"/>
      <ellipse cx="-50" cy="24" rx="19" ry="54" fill="#256b32" transform="rotate(-55)"/>
      <ellipse cx="50" cy="24" rx="19" ry="54" fill="#256b32" transform="rotate(55)"/>
      <path d="M0 -92 L0 64" stroke="#174820" stroke-width="2.5"/>
    </g>
  </g>

  <!-- Snippet JSON (esquerda do título) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#b7e9ff">
    <rect x="250" y="48" width="280" height="168" rx="10" fill="#02182a" fill-opacity="0.72" stroke="#3aa7c8" stroke-opacity="0.45"/>
    <text x="270" y="78">"endpoint": "/api/v1",</text>
    <text x="270" y="100">"method": "GET",</text>
    <text x="270" y="122">"status": "ok",</text>
    <text x="270" y="144">"data": {</text>
    <text x="286" y="166">"items": [{ "id": 123 }]</text>
    <text x="270" y="188">}</text>
  </g>

  <!-- Ícone {} (direita do título) -->
  <g transform="translate(1520,70)" fill="none" stroke="#7fe9ff" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)">
    <rect x="0" y="0" width="90" height="90" rx="10" opacity="0.9"/>
    <path d="M32 22 C18 28 18 62 32 68"/>
    <path d="M58 22 C72 28 72 62 58 68"/>
  </g>

  <!-- Título -->
  <text x="960" y="118" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="78" font-weight="900" fill="#f7efdf" letter-spacing="4">API KUNK</text>

  <!-- Painel esquerdo -->
  <g>
    <rect x="210" y="290" width="420" height="520" rx="28" fill="#fdf4e5" stroke="#c9a24a" stroke-width="3"/>
    <text x="420" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#111">O QUE O MÓDULO FAZ</text>
    <line x1="250" y1="365" x2="590" y2="365" stroke="#111" stroke-width="2"/>

    <!-- item 1 -->
    <circle cx="290" cy="430" r="28" fill="#111"/>
    <g fill="#fff" transform="translate(290,430)">
      <circle cx="0" cy="-8" r="8"/>
      <path d="M-14 18 C-14 6 14 6 14 18 Z"/>
    </g>
    <text x="340" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="340" dy="0">Autentica operadores</tspan>
      <tspan x="340" dy="26">e associados</tspan>
    </text>

    <!-- item 2 -->
    <circle cx="290" cy="530" r="28" fill="#111"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" transform="translate(290,530)">
      <rect x="-10" y="-12" width="20" height="24" rx="2"/>
      <path d="M-5 -4 H5 M-5 2 H5 M-5 8 H2"/>
    </g>
    <text x="340" y="522" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="340" dy="0">Acesso a triagem,</tspan>
      <tspan x="340" dy="26">pedidos, atendimentos</tspan>
    </text>

    <!-- item 3 -->
    <circle cx="290" cy="630" r="28" fill="#111"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" transform="translate(290,630)">
      <rect x="-14" y="-6" width="10" height="12" rx="2"/>
      <rect x="4" y="-6" width="10" height="12" rx="2"/>
      <path d="M-4 0 H4"/>
    </g>
    <text x="340" y="626" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111">
      <tspan x="340" dy="0">Conecta com</tspan>
      <tspan x="340" dy="26">serviços externos</tspan>
    </text>
  </g>

  <!-- Emblema central -->
  <g transform="translate(960,550)">
    <circle r="168" fill="#003528" stroke="#d4af57" stroke-width="5"/>
    <circle r="148" fill="none" stroke="#0e5a45" stroke-width="2" opacity="0.7"/>
    <!-- wireframe / rede -->
