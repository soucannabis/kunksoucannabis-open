<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kunk — Capa</title>
    <link rel="stylesheet" href="./cover-layout.css" />
  </head>
  <body>
    <main id="cover" class="cover" aria-label="Capa de vídeo">
      <div class="cover__background" aria-hidden="true"></div>
      <div class="cover__grid" aria-hidden="true"></div>
      <div class="foliage foliage--left" aria-hidden="true"></div>
      <div class="foliage foliage--right" aria-hidden="true"></div>

      <header class="cover__header">
        <p id="eyebrow" class="cover__eyebrow"></p>
        <h1 id="title" class="cover__title"></h1>
      </header>

      <section class="cover__content">
        <article class="panel panel--left">
          <h2 id="left-title"></h2>
          <div id="left-items" class="panel__items"></div>
        </article>

        <section class="hero" aria-label="Símbolo principal">
          <div id="hero-icon" class="hero__icon"></div>
        </section>

        <article class="panel panel--right">
          <h2 id="right-title"></h2>
          <div id="right-items" class="panel__items"></div>
        </article>
      </section>

      <footer id="footer" class="cover__footer"></footer>
    </main>
